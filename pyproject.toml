[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forestgeom"
version = "0.0.1"
description = "Forest kernel package"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
	{ name = "Jake Rhodes", email = "jakerhodes8@gmail.com" },
	{ name = "Adrien Aumon", email = "adrien.aumon@umontreal.ca" },
]
urls = { "Homepage" = "https://github.com/jakerhodes/RF-GAP-Python" }

dependencies = [
	"numpy",
	"scipy",
	"scikit-learn",
]

[project.optional-dependencies]
boosted = ["lightgbm", "xgboost"]
viz = ["matplotlib", "seaborn", "umap-learn"]
experiments = ["pandas", "pyarrow", "matplotlib", "seaborn", "umap-learn"]
test = ["pytest", "pytest-cov"]
all = ["lightgbm","xgboost","matplotlib","seaborn","umap-learn","pandas","pyarrow","pytest","pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/forestgeom"]
